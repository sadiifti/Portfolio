<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)" />

  <!-- Grid Pattern -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="350" x2="800" y2="350" />
  </g>

  <!-- Header Badge -->
  <rect x="50" y="30" width="220" height="28" rx="14" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
  <text x="160" y="49" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">PACER DUAL-STREAM AI</text>

  <!-- Pipeline Step 1: ECG Wave -->
  <g transform="translate(60, 110)">
    <rect width="180" height="250" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="90" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">12-Lead Pediatric ECG</text>
    <text x="90" y="55" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">10,344 Patient Records</text>
    
    <!-- ECG waveform line -->
    <path d="M 15 130 L 40 130 L 50 115 L 60 150 L 75 70 L 90 170 L 105 130 L 125 130 L 135 110 L 150 130 L 165 130" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)" />
    <path d="M 15 180 L 45 180 L 55 170 L 70 200 L 85 140 L 98 190 L 115 180 L 165 180" 
          fill="none" stroke="#818cf8" stroke-width="2" opacity="0.8" />
    <text x="90" y="230" fill="#38bdf8" font-family="monospace" font-size="10" text-anchor="middle">Lead I-V6 DWT Wavelets</text>
  </g>

  <!-- Connector arrow 1 -->
  <path d="M 245 235 L 295 235" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="295,230 305,235 295,240" fill="#38bdf8" />

  <!-- Pipeline Step 2: Transformer Attention Core -->
  <g transform="translate(310, 85)">
    <rect width="210" height="300" rx="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" filter="url(#glow)" />
    <rect x="20" y="20" width="170" height="30" rx="8" fill="#1e293b" />
    <text x="105" y="40" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Transformer Self-Attention</text>
    
    <!-- Multi-head attention visual grid -->
    <g transform="translate(30, 75)">
      <rect x="0" y="0" width="32" height="32" rx="6" fill="#0284c7" opacity="0.9" />
      <rect x="40" y="0" width="32" height="32" rx="6" fill="#0369a1" opacity="0.6" />
      <rect x="80" y="0" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.95" />
      <rect x="120" y="0" width="32" height="32" rx="6" fill="#075985" opacity="0.4" />
      
      <rect x="0" y="40" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.8" />
      <rect x="40" y="40" width="32" height="32" rx="6" fill="#0284c7" opacity="0.95" />
      <rect x="80" y="40" width="32" height="32" rx="6" fill="#0369a1" opacity="0.5" />
      <rect x="120" y="40" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.7" />

      <rect x="0" y="80" width="32" height="32" rx="6" fill="#075985" opacity="0.4" />
      <rect x="40" y="80" width="32" height="32" rx="6" fill="#38bdf8" opacity="0.85" />
      <rect x="80" y="80" width="32" height="32" rx="6" fill="#0284c7" opacity="0.9" />
      <rect x="120" y="80" width="32" height="32" rx="6" fill="#0369a1" opacity="0.6" />
    </g>

    <!-- TabNet Fusion Layer -->
    <rect x="25" y="215" width="160" height="40" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1" />
    <text x="105" y="240" fill="#f8fafc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TabNet Clinical Metadata</text>
    <text x="105" y="280" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">DWT + CNN + TabNet</text>
  </g>

  <!-- Connector arrow 2 -->
  <path d="M 525 235 L 575 235" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" />
  <polygon points="575,230 585,235 575,240" fill="#10b981" />

  <!-- Pipeline Step 3: Benchmarks & Output -->
  <g transform="translate(590, 110)">
    <rect width="160" height="250" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="80" y="40" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Diagnostic Output</text>
    
    <rect x="20" y="70" width="120" height="65" rx="12" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="80" y="98" fill="#34d399" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">90.93%</text>
    <text x="80" y="120" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Model Accuracy</text>

    <rect x="20" y="150" width="120" height="65" rx="12" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <text x="80" y="178" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="bold" text-anchor="middle">0.95</text>
    <text x="80" y="200" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle">ROC-AUC Score</text>
  </g>
</svg>
