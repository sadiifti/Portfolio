<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg4)" />

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Header Badge -->
  <rect x="50" y="30" width="310" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
  <text x="205" y="49" fill="#a5b4fc" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ANN-LSTM HYBRID RECURRENT MODEL</text>

  <!-- Left: Time Series Plot -->
  <g transform="translate(60, 95)">
    <rect width="450" height="280" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="25" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold">PM2.5 Temporal Forecast Curve</text>
    <text x="425" y="35" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="end">60,000+ Urban Samples</text>

    <!-- Axes -->
    <line x1="40" y1="230" x2="410" y2="230" stroke="#475569" stroke-width="1.5" />
    <line x1="40" y1="60" x2="40" y2="230" stroke="#475569" stroke-width="1.5" />

    <!-- Actual Ground Truth Curve (cyan) -->
    <path d="M 40 180 Q 80 140, 120 160 T 200 90 T 280 140 T 360 80 T 410 110" 
          fill="none" stroke="#38bdf8" stroke-width="2.5" opacity="0.7" />

    <!-- Predicted LSTM Curve (violet/pink) -->
    <path d="M 40 182 Q 80 138, 120 163 T 200 92 T 280 138 T 360 83 T 410 108" 
          fill="none" stroke="#e879f9" stroke-width="2.5" stroke-dasharray="4,4" filter="url(#glow4)" />

    <!-- Legend -->
    <line x1="60" y1="255" x2="90" y2="255" stroke="#38bdf8" stroke-width="3" />
    <text x="95" y="259" fill="#94a3b8" font-family="monospace" font-size="10">Actual PM2.5</text>

    <line x1="200" y1="255" x2="230" y2="255" stroke="#e879f9" stroke-width="3" stroke-dasharray="4,4" />
    <text x="235" y="259" fill="#94a3b8" font-family="monospace" font-size="10">Hybrid ANN-LSTM Prediction</text>
  </g>

  <!-- Right Metrics Card -->
  <g transform="translate(540, 95)">
    <rect width="200" height="280" rx="18" fill="#0f172a" stroke="#a855f7" stroke-width="1.5" />
    <text x="100" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Evaluation Metrics</text>

    <rect x="20" y="65" width="160" height="55" rx="10" fill="#3b0764" stroke="#7e22ce" stroke-width="1" />
    <text x="100" y="92" fill="#d8b4fe" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">94.87%</text>
    <text x="100" y="110" fill="#e9d5ff" font-family="monospace" font-size="10" text-anchor="middle">Model Accuracy</text>

    <rect x="20" y="135" width="160" height="55" rx="10" fill="#0f172a" stroke="#475569" stroke-width="1" />
    <text x="100" y="162" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">60,000+</text>
    <text x="100" y="180" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Meteorological Records</text>

    <rect x="20" y="205" width="160" height="55" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="100" y="232" fill="#818cf8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">PM2.5 &amp; AQI</text>
    <text x="100" y="250" fill="#c7d2fe" font-family="monospace" font-size="10" text-anchor="middle">Classification Levels</text>
  </g>
</svg>
