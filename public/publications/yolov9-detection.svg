<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1626" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg3)" />

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="80" y1="0" x2="80" y2="450" />
    <line x1="240" y1="0" x2="240" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="560" y1="0" x2="560" y2="450" />
    <line x1="720" y1="0" x2="720" y2="450" />
    <line x1="0" y1="110" x2="800" y2="110" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="340" x2="800" y2="340" />
  </g>

  <!-- Header Badge -->
  <rect x="50" y="30" width="300" height="28" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1" />
  <text x="200" y="49" fill="#34d399" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">YOLOv9 REAL-TIME COMPUTER VISION</text>

  <!-- Video Stream Simulation Card -->
  <g transform="translate(60, 95)">
    <rect width="440" height="280" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Camera Frame Header -->
    <rect x="15" y="15" width="410" height="30" rx="8" fill="#1e293b" />
    <circle cx="30" cy="30" r="4" fill="#ef4444" />
    <text x="42" y="34" fill="#94a3b8" font-family="monospace" font-size="11">LIVE URBAN TRAFFIC INFERENCE &bull; 1080p</text>
    <text x="415" y="34" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">&gt;35.4 FPS</text>

    <!-- Simulated Vehicle Silhouette -->
    <path d="M 60 210 L 100 130 L 320 130 L 370 210 Z" fill="#1e293b" stroke="#475569" stroke-width="2" />
    <rect x="50" y="210" width="330" height="40" rx="8" fill="#334155" />

    <!-- YOLOv9 Bounding Box (License Plate Target) -->
    <rect x="140" y="195" width="150" height="50" rx="6" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="2.5" filter="url(#glow3)" />
    
    <!-- Bounding Box Label -->
    <rect x="140" y="172" width="125" height="20" rx="4" fill="#10b981" />
    <text x="145" y="186" fill="#022c22" font-family="monospace" font-size="10" font-weight="bold">PLATE 99.2% YOLOv9</text>

    <!-- License Plate Content (Multilingual OCR) -->
    <text x="215" y="225" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">DHAKA METRO GA-12</text>
  </g>

  <!-- Right Metrics Card -->
  <g transform="translate(530, 95)">
    <rect width="210" height="280" rx="18" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="105" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">OCR Pipeline Metrics</text>

    <rect x="20" y="60" width="170" height="55" rx="10" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="105" y="87" fill="#34d399" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">0.99 F1-SCORE</text>
    <text x="105" y="105" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">Detection Precision</text>

    <rect x="20" y="130" width="170" height="55" rx="10" fill="#082f49" stroke="#0284c7" stroke-width="1" />
    <text x="105" y="157" fill="#38bdf8" font-family="sans-serif" font-size="20" font-weight="bold" text-anchor="middle">&gt;35 FPS</text>
    <text x="105" y="175" fill="#bae6fd" font-family="monospace" font-size="10" text-anchor="middle">Low Latency Edge</text>

    <rect x="20" y="200" width="170" height="55" rx="10" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="105" y="227" fill="#818cf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Bangla + English</text>
    <text x="105" y="245" fill="#c7d2fe" font-family="monospace" font-size="10" text-anchor="middle">Custom OCR Parser</text>
  </g>
</svg>
