<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09131f" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg2)" />

  <!-- Grid -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.35">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
  </g>

  <!-- Header Badge -->
  <rect x="50" y="30" width="280" height="28" rx="14" fill="#082f49" stroke="#0284c7" stroke-width="1" />
  <text x="190" y="49" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">MDPI 2026 &bull; IEEE 1451 &bull; IIoT DEFENSE</text>

  <!-- Left: Industrial Municipal SCADA Water Infra -->
  <g transform="translate(60, 100)">
    <rect width="210" height="270" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <text x="105" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Municipal Water Treatment</text>
    <text x="105" y="55" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">SCADA / PLC / Sensor Telemetry</text>

    <!-- Water Plant Physical Nodes -->
    <circle cx="50" cy="110" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <text x="50" y="115" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">PUMP</text>

    <circle cx="160" cy="110" r="22" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <text x="160" y="115" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">FLOW</text>

    <circle cx="105" cy="190" r="24" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2" />
    <text x="105" y="195" fill="#ffffff" font-family="monospace" font-size="10" text-anchor="middle">PLC/RTU</text>

    <!-- Connectors -->
    <line x1="68" y1="125" x2="90" y2="170" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="142" y1="125" x2="120" y2="170" stroke="#38bdf8" stroke-width="1.5" />
    <text x="105" y="245" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">IEEE 1451 Smart Transducers</text>
  </g>

  <!-- Middle: Adversarial Threat Modeling & Shield -->
  <g transform="translate(305, 80)">
    <rect width="230" height="310" rx="20" fill="#0f172a" stroke="#ef4444" stroke-width="1.5" filter="url(#glow2)" />
    <text x="115" y="38" fill="#f87171" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Adversarial Vector Modeling</text>
    
    <!-- Shield Icon Illustration -->
    <path d="M 115 70 L 175 100 L 175 170 C 175 220 115 250 115 250 C 115 250 55 220 55 170 L 55 100 Z"
          fill="#1e1b4b" stroke="#6366f1" stroke-width="3" />
    <path d="M 115 90 L 155 110 L 155 160 C 155 200 115 225 115 225 C 115 225 75 200 75 160 L 75 110 Z"
          fill="#0284c7" stroke="#38bdf8" stroke-width="2" opacity="0.8" />
    
    <text x="115" y="165" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">&#128737;</text>
    <text x="115" y="280" fill="#a5b4fc" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Industry 5.0 Resilient Defense</text>
  </g>

  <!-- Right: Mitigation & Verification -->
  <g transform="translate(565, 100)">
    <rect width="180" height="270" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="90" y="35" fill="#f8fafc" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Security Protocols</text>
    
    <rect x="20" y="70" width="140" height="45" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="90" y="97" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">FDI Attack Rejection</text>

    <rect x="20" y="130" width="140" height="45" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1" />
    <text x="90" y="157" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Network Isolation</text>

    <rect x="20" y="190" width="140" height="45" rx="8" fill="#0c4a6e" stroke="#0284c7" stroke-width="1" />
    <text x="90" y="217" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Anomaly Telemetry</text>
  </g>
</svg>
